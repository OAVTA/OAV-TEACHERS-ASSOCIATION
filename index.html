<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAVTA - Odisha Adarsha Vidyalaya Teachers Association</title>
  
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Firebase App & Auth SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --primary: #1a365d;
      --secondary: #2b6cb0;
      --accent: #d69e2e;
      --light-bg: #f7fafc;
      --dark-text: #2d3748;
      --success-green: #38a169;
      --danger-red: #e53e3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: var(--light-bg); color: var(--dark-text); }

    header {
      background: var(--primary);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-family: 'Cinzel', serif; font-size: 1.5rem; }

    nav button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }

    /* Forms & Cards */
    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
    }

    .btn {
      background: var(--secondary);
      color: white;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover { opacity: 0.9; }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>OAVTA Portal</h1>
    <nav>
      <button onclick="openModal('portalLoginModal')"><i class="fas fa-sign-in-alt"></i> Login Portal</button>
    </nav>
  </header>

  <!-- MAIN REGISTRATION FORM -->
  <div class="container">
    <div class="card">
      <h2 style="color: var(--primary); font-family: 'Cinzel', serif; margin-bottom: 1.5rem;">
        <i class="fas fa-user-plus"></i> Member Registration
      </h2>
      <form id="registrationForm" onsubmit="handleRegistration(event)">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" required placeholder="Enter Full Name">
        </div>
        <div class="form-group">
          <label for="reg-phone">Mobile Number</label>
          <input type="tel" id="reg-phone" required placeholder="10-digit Mobile Number">
        </div>
        <div class="form-group">
          <label for="reg-district">District</label>
          <select id="reg-district" required>
            <option value="">Select District</option>
            <option value="Angul">Angul</option>
            <option value="Cuttack">Cuttack</option>
            <option value="Khordha">Khordha</option>
          </select>
        </div>
        <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Register Member</button>
      </form>
    </div>
  </div>

  <!-- PORTAL LOGIN MODAL (PHONE + OTP AUTH) -->
  <div id="portalLoginModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('portalLoginModal')">&times;</span>
      <h2 style="color: var(--primary); font-family: 'Cinzel', serif; text-align: center; margin-bottom: 20px;">
        <i class="fas fa-user-lock"></i> Portal Login
      </h2>
      
      <form id="loginForm" onsubmit="event.preventDefault();">
        <!-- 1. Role Selection -->
        <div class="form-group">
          <label for="userRole"><i class="fas fa-user-tag"></i> Select Role</label>
          <select id="userRole" required onchange="toggleRoleFields()">
            <option value="member">Member</option>
            <option value="district">District Admin</option>
            <option value="state">State Admin</option>
          </select>
        </div>

        <!-- Member ID Field -->
        <div class="form-group" id="memberFieldGroup">
          <label for="memLoginId"><i class="fas fa-id-card"></i> Member ID</label>
          <input type="text" id="memLoginId" placeholder="e.g., OAVTA-1001">
        </div>

        <!-- District Admin Select Field -->
        <div class="form-group" id="districtFieldGroup" style="display: none;">
          <label for="distId"><i class="fas fa-map-marker-alt"></i> Select District</label>
          <select id="distId">
            <option value="">Select District</option>
            <option value="Angul">Angul</option>
            <option value="Cuttack">Cuttack</option>
            <option value="Khordha">Khordha</option>
          </select>
        </div>

        <!-- Mobile Number Input -->
        <div class="form-group">
          <label for="loginPhone"><i class="fas fa-mobile-alt"></i> Mobile Number</label>
          <input type="tel" id="loginPhone" placeholder="+919876543210" required>
        </div>

        <!-- Invisible reCAPTCHA Anchor -->
        <div id="recaptcha-container"></div>

        <!-- Request OTP Button -->
        <button type="button" class="btn" id="sendOtpBtn" onclick="sendLoginOTP()" style="margin-top: 10px;">
          <i class="fas fa-paper-plane"></i> Send OTP
        </button>

        <!-- 2. OTP Verification Input (Hidden Initially) -->
        <div id="otpSection" style="display: none; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px;">
          <div class="form-group">
            <label for="loginOtp"><i class="fas fa-key"></i> Enter 6-Digit OTP</label>
            <input type="text" id="loginOtp" maxlength="6" placeholder="123456">
          </div>
          
          <button type="button" class="btn" onclick="verifyLoginOTP()" style="background-color: var(--success-green);">
            <i class="fas fa-sign-in-alt"></i> Verify & Login
          </button>
        </div>

        <!-- Status / Error Notification -->
        <div id="loginStatusMsg" style="margin-top: 15px; text-align: center; font-weight: bold; font-size: 0.9rem;"></div>
      </form>
    </div>
  </div>

  <!-- SCRIPT BLOCK: FIREBASE INIT & OTP LOGIC -->
  <script>
    // 1. YOUR FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "oavta-28105.firebaseapp.com",
      projectId: "oavta-28105",
      storageBucket: "oavta-28105.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let confirmationResultObj = null;

    // Initialize Invisible reCAPTCHA on Window Load
    window.onload = function() {
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
      });
    };

    // UI Modal Utility Functions
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Dynamic Form Role Switcher
    function toggleRoleFields() {
      const role = document.getElementById("userRole").value;
      document.getElementById("memberFieldGroup").style.display = (role === "member") ? "block" : "none";
      document.getElementById("districtFieldGroup").style.display = (role === "district") ? "block" : "none";
    }

    // Member Registration Handler
    async function handleRegistration(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const district = document.getElementById('reg-district').value;
      const memberId = "OAVTA-" + Math.floor(1000 + Math.random() * 9000);

      try {
        await db.collection("members").doc(memberId).set({
          memberId: memberId,
          name: name,
          phone: phone,
          district: district,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert(`Registration Successful!\nYour Member ID is: ${memberId}`);
        document.getElementById('registrationForm').reset();
      } catch (error) {
        alert("Registration Failed: " + error.message);
      }
    }

    // STEP 1: SEND OTP FUNCTION
    async function sendLoginOTP() {
      const statusDiv = document.getElementById("loginStatusMsg");
      const rawPhone = document.getElementById("loginPhone").value.trim();

      if (!rawPhone) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Please enter your mobile number.";
        return;
      }

      const formattedPhone = rawPhone.startsWith('+') ? rawPhone : '+91' + rawPhone;

      statusDiv.style.color = "var(--secondary)";
      statusDiv.innerText = "Sending OTP to " + formattedPhone + "...";

      try {
        confirmationResultObj = await firebase.auth().signInWithPhoneNumber(formattedPhone, window.recaptchaVerifier);
        statusDiv.style.color = "var(--success-green)";
        statusDiv.innerText = "OTP sent successfully! Enter code below.";
        
        document.getElementById("otpSection").style.display = "block";
        document.getElementById("sendOtpBtn").style.display = "none";
      } catch (error) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Error: " + error.message;
        window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
      }
    }

    // STEP 2: VERIFY OTP AND AUTHENTICATE
    async function verifyLoginOTP() {
      const statusDiv = document.getElementById("loginStatusMsg");
      const otpCode = document.getElementById("loginOtp").value.trim();
      const role = document.getElementById("userRole").value;

      if (!otpCode || otpCode.length !== 6) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Please enter a valid 6-digit OTP.";
        return;
      }

      statusDiv.style.color = "var(--secondary)";
      statusDiv.innerText = "Verifying OTP...";

      try {
        const result = await confirmationResultObj.confirm(otpCode);
        const user = result.user;
        
        statusDiv.style.color = "var(--success-green)";
        statusDiv.innerText = "Authentication Successful! Redirecting...";

        if (role === 'member') {
          closeModal("portalLoginModal");
          alert("Welcome to the Member Portal!");
        } else if (role === 'district' || role === 'state') {
          window.location.href = "admin.html";
        }
      } catch (error) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Invalid OTP. Please try again.";
      }
    }
  </script>
</body>
</html>
