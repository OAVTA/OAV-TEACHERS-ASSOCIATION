<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAVTA - Odisha Adarsha Vidyalaya Teachers Association</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Firebase App & SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --primary: #1a365d;
      --secondary: #2b6cb0;
      --accent: #d69e2e;
      --light-bg: #f7fafc;
      --dark-text: #2d3748;
      --success-green: #38a169;
      --danger-red: #e53e3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: var(--light-bg); color: var(--dark-text); }

    header {
      background: var(--primary);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-family: 'Cinzel', serif; font-size: 1.5rem; }

    nav button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
    }

    .btn {
      background: var(--secondary);
      color: white;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>OAVTA Portal</h1>
    <nav>
      <button onclick="openModal('portalLoginModal')"><i class="fas fa-sign-in-alt"></i> Login Portal</button>
    </nav>
  </header>

  <!-- MEMBER REGISTRATION FORM -->
  <div class="container">
    <div class="card">
      <h2 style="color: var(--primary); font-family: 'Cinzel', serif; margin-bottom: 1.5rem;">
        <i class="fas fa-user-plus"></i> Member Registration
      </h2>
      <form id="registrationForm" onsubmit="handleRegistration(event)">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" required placeholder="Enter Full Name">
        </div>
        <div class="form-group">
          <label for="reg-phone">Mobile Number</label>
          <input type="tel" id="reg-phone" required placeholder="10-digit Mobile Number">
        </div>
        <div class="form-group">
          <label for="reg-district">District</label>
          <select id="reg-district" required>
            <option value="">Select District</option>
            <option value="Angul">Angul</option>
            <option value="Cuttack">Cuttack</option>
            <option value="Khordha">Khordha</option>
          </select>
        </div>
        <!-- Member Custom Password Field -->
        <div class="form-group">
          <label for="reg-password">Set Your Login Password</label>
          <input type="password" id="reg-password" required minlength="6" placeholder="Minimum 6 characters">
        </div>
        <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Register Member</button>
      </form>
    </div>
  </div>

  <!-- PORTAL LOGIN MODAL -->
  <div id="portalLoginModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('portalLoginModal')">&times;</span>
      <h2 style="color: var(--primary); font-family: 'Cinzel', serif; text-align: center; margin-bottom: 20px;">
        <i class="fas fa-user-lock"></i> Portal Login
      </h2>
      
      <form id="loginForm" onsubmit="event.preventDefault();">
        <!-- 1. Role Selection -->
        <div class="form-group">
          <label for="userRole"><i class="fas fa-user-tag"></i> Select Role</label>
          <select id="userRole" required onchange="toggleRoleFields()">
            <option value="member">Member</option>
            <option value="district">District Admin</option>
            <option value="state">State Admin</option>
          </select>
        </div>

        <!-- MEMBER SPECIFIC FIELDS (ID + Password) -->
        <div id="memberLoginFields">
          <div class="form-group">
            <label for="memLoginId"><i class="fas fa-id-card"></i> Member ID</label>
            <input type="text" id="memLoginId" placeholder="e.g., OAVTA-1001">
          </div>
          <div class="form-group">
            <label for="memPassword"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="memPassword" placeholder="Enter your password">
          </div>
          <button type="button" class="btn" onclick="loginMemberWithPassword()">
            <i class="fas fa-sign-in-alt"></i> Login as Member
          </button>
        </div>

        <!-- ADMIN SPECIFIC FIELDS (District Select + Phone OTP) -->
        <div id="adminLoginFields" style="display: none;">
          <div class="form-group" id="districtFieldGroup" style="display: none;">
            <label for="distId"><i class="fas fa-map-marker-alt"></i> Select District</label>
            <select id="distId">
              <option value="">Select District</option>
              <option value="Angul">Angul</option>
              <option value="Cuttack">Cuttack</option>
              <option value="Khordha">Khordha</option>
            </select>
          </div>

          <div class="form-group">
            <label for="loginPhone"><i class="fas fa-mobile-alt"></i> Registered Admin Phone Number</label>
            <input type="tel" id="loginPhone" placeholder="+919876543210">
          </div>

          <div id="recaptcha-container"></div>

          <button type="button" class="btn" id="sendOtpBtn" onclick="sendAdminOTP()" style="margin-top: 10px;">
            <i class="fas fa-paper-plane"></i> Send Admin OTP
          </button>

          <div id="otpSection" style="display: none; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px;">
            <div class="form-group">
              <label for="loginOtp"><i class="fas fa-key"></i> Enter 6-Digit OTP</label>
              <input type="text" id="loginOtp" maxlength="6" placeholder="123456">
            </div>
            <button type="button" class="btn" onclick="verifyAdminOTP()" style="background-color: var(--success-green);">
              <i class="fas fa-shield-alt"></i> Verify & Access Admin Panel
            </button>
          </div>
        </div>

        <div id="loginStatusMsg" style="margin-top: 15px; text-align: center; font-weight: bold; font-size: 0.9rem;"></div>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBgVnOxo6wb6Ahrs2dqhVwgrqCFtZQRlRU",
      authDomain: "oavta-28105.firebaseapp.com",
      databaseURL: "https://oavta-28105-default-rtdb.firebaseio.com",
      projectId: "oavta-28105",
      storageBucket: "oavta-28105.firebasestorage.app",
      messagingSenderId: "123510841027",
      appId: "1:123510841027:web:ba924a6bd865531cab0c76",
      measurementId: "G-6PZQR5J90C"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    let confirmationResultObj = null;

    window.onload = function() {
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
      });
    };

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Toggle forms depending on selected Role
    function toggleRoleFields() {
      const role = document.getElementById("userRole").value;
      if (role === 'member') {
        document.getElementById("memberLoginFields").style.display = "block";
        document.getElementById("adminLoginFields").style.display = "none";
      } else {
        document.getElementById("memberLoginFields").style.display = "none";
        document.getElementById("adminLoginFields").style.display = "block";
        document.getElementById("districtFieldGroup").style.display = (role === "district") ? "block" : "none";
      }
    }

    // Member Registration (Saves Member ID + Password)
    async function handleRegistration(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const district = document.getElementById('reg-district').value;
      const password = document.getElementById('reg-password').value;
      const memberId = "OAVTA-" + Math.floor(1000 + Math.random() * 9000);

      try {
        await db.collection("members").doc(memberId).set({
          memberId: memberId,
          name: name,
          phone: phone,
          district: district,
          password: password, // Custom password saved
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert(`Registration Successful!\nYour Member ID is: ${memberId}\nPlease use this ID and your password to log in.`);
        document.getElementById('registrationForm').reset();
      } catch (error) {
        alert("Registration Failed: " + error.message);
      }
    }

    // 1. MEMBER LOGIN (Member ID + Password)
    async function loginMemberWithPassword() {
      const statusDiv = document.getElementById("loginStatusMsg");
      const memId = document.getElementById("memLoginId").value.trim();
      const password = document.getElementById("memPassword").value;

      if (!memId || !password) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Please enter Member ID and Password.";
        return;
      }

      statusDiv.style.color = "var(--secondary)";
      statusDiv.innerText = "Authenticating...";

      try {
        const doc = await db.collection("members").doc(memId).get();
        if (doc.exists && doc.data().password === password) {
          sessionStorage.setItem("userRole", "member");
          sessionStorage.setItem("memberData", JSON.stringify(doc.data()));
          alert("Welcome " + doc.data().name + "!");
          closeModal("portalLoginModal");
          statusDiv.innerText = "";
        } else {
          statusDiv.style.color = "var(--danger-red)";
          statusDiv.innerText = "Invalid Member ID or Password.";
        }
      } catch (error) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Login error: " + error.message;
      }
    }

    // 2. ADMIN OTP SENDING (District / State Admins Only)
    async function sendAdminOTP() {
      const statusDiv = document.getElementById("loginStatusMsg");
      const rawPhone = document.getElementById("loginPhone").value.trim();

      if (!rawPhone) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Please enter mobile number.";
        return;
      }

      const formattedPhone = rawPhone.startsWith('+') ? rawPhone : '+91' + rawPhone;
      statusDiv.style.color = "var(--secondary)";
      statusDiv.innerText = "Sending Admin OTP to " + formattedPhone + "...";

      try {
        confirmationResultObj = await firebase.auth().signInWithPhoneNumber(formattedPhone, window.recaptchaVerifier);
        statusDiv.style.color = "var(--success-green)";
        statusDiv.innerText = "OTP sent! Enter 6-digit code below.";
        
        document.getElementById("otpSection").style.display = "block";
        document.getElementById("sendOtpBtn").style.display = "none";
      } catch (error) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Error: " + error.message;
        window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
      }
    }

    // 3. ADMIN OTP VERIFICATION
    async function verifyAdminOTP() {
      const statusDiv = document.getElementById("loginStatusMsg");
      const otpCode = document.getElementById("loginOtp").value.trim();
      const role = document.getElementById("userRole").value;

      if (!otpCode || otpCode.length !== 6) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = "Please enter a valid 6-digit OTP.";
        return;
      }

      statusDiv.style.color = "var(--secondary)";
      statusDiv.innerText = "Verifying Admin Permissions...";

      try {
        const result = await confirmationResultObj.confirm(otpCode);
        const authPhone = result.user.phoneNumber;

        if (role === 'district') {
          const selectedDistrict = document.getElementById("distId").value;
          if (!selectedDistrict) throw new Error("Please select a district.");

          const doc = await db.collection("district_admins").doc(selectedDistrict).get();
          if (doc.exists && isPhoneMatch(doc.data().phone, authPhone)) {
            sessionStorage.setItem("userRole", "district");
            sessionStorage.setItem("adminDistrict", selectedDistrict);
            window.location.href = "admin.html";
          } else {
            throw new Error("Phone number not authorized for " + selectedDistrict + " district.");
          }
        } else if (role === 'state') {
          const doc = await db.collection("state_admins").doc(authPhone).get();
          if (doc.exists) {
            sessionStorage.setItem("userRole", "state");
            window.location.href = "admin.html";
          } else {
            throw new Error("Phone number not authorized as State Admin.");
          }
        }
      } catch (error) {
        statusDiv.style.color = "var(--danger-red)";
        statusDiv.innerText = error.message;
      }
    }

    function isPhoneMatch(dbPhone, authPhone) {
      const cleanDb = dbPhone.replace(/\D/g, '').slice(-10);
      const cleanAuth = authPhone.replace(/\D/g, '').slice(-10);
      return cleanDb === cleanAuth;
    }
  </script>
</body>
</html>
