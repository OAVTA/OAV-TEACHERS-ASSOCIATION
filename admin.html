</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto p-6">
        <!-- Top Navigation Bar -->
        <div class="flex justify-between items-center bg-white p-6 rounded-lg shadow-sm mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800"><i class="fa-solid fa-users-gear text-blue-900 mr-2"></i>OAVTA Management Portal</h1>
                <p class="text-slate-500 text-sm" id="role-badge">Checking permissions...</p>
            </div>
            <div class="flex gap-3">
                <!-- State Admin Only Action Button -->
                <button id="state-user-btn" onclick="openUserModal()" class="hidden bg-sky-600 text-white px-4 py-2 rounded font-medium hover:bg-sky-700 transition flex items-center gap-2 text-sm shadow">
                    <i class="fa-solid fa-user-plus"></i> Create Admin Credentials
                </button>
                <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded font-medium hover:bg-red-700 transition text-sm">
                    Logout
                </button>
            </div>
        </div>

        <!-- Filters & Search Bar -->
        <div class="bg-white p-4 rounded-lg shadow-sm mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                <!-- Search Input -->
                <div class="relative w-full md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Search by name, ID, or school..." class="border pl-9 pr-3 py-2 rounded w-full text-sm outline-none focus:ring-2 focus:ring-blue-900">
                </div>
                
                <!-- District Dropdown -->
                <select id="district-filter" onchange="onDistrictChange('district-filter', 'block-filter'); filterTable();" class="border px-3 py-2 rounded w-full md:w-48 text-sm outline-none focus:ring-2 focus:ring-blue-900">
                    <option value="">All Districts</option>
                </select>

                <!-- Block Dropdown (Cascading) -->
                <select id="block-filter" onchange="filterTable()" class="border px-3 py-2 rounded w-full md:w-48 text-sm outline-none focus:ring-2 focus:ring-blue-900">
                    <option value="">All Blocks</option>
                </select>
            </div>

            <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-5 py-2 rounded font-medium hover:bg-emerald-700 transition w-full md:w-auto flex items-center justify-center gap-2 text-sm shadow">
                <i class="fa-solid fa-file-excel"></i> Export to Excel (.xlsx)
            </button>
        </div>

        <!-- Member Records Data Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-x-auto">
            <table class="w-full text-left border-collapse" id="members-table">
                <thead>
                    <tr class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                        <th class="p-4">Member ID</th>
                        <th class="p-4">Full Name</th>
                        <th class="p-4">Phone</th>
                        <th class="p-4">Designation</th>
                        <th class="p-4">District</th>
                        <th class="p-4">Block</th>
                        <th class="p-4">School (OAV)</th>
                        <th class="p-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y text-sm text-slate-700">
                    <tr><td colspan="8" class="p-6 text-center text-slate-400">Loading authorized database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- STATE ADMIN: CREATE CREDENTIALS MODAL -->
    <div id="userModal" class="fixed inset-0 bg-black/60 hidden backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-blue-950 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-key text-sky-400"></i> Assign District / State Account</h3>
                <button onclick="closeUserModal()" class="text-slate-300 hover:text-white text-xl font-bold">&times;</button>
            </div>
            
            <form onsubmit="handleCreateUser(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Select Access Role</label>
                    <select id="new-user-role" onchange="toggleDistrictSelect()" class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                        <option value="district">District Admin</option>
                        <option value="state">State Super Admin</option>
                    </select>
                </div>

                <div id="district-assign-box">
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Assign District</label>
                    <select id="new-user-district" class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Manual Assign ID (Username/Email)</label>
                    <input type="text" id="new-user-id" placeholder="e.g. dist_khordha or admin@oavta.in" required class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Assign Password</label>
                    <input type="password" id="new-user-pass" placeholder="••••••••" required class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-100">
                    <button type="button" onclick="closeUserModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-100 text-sm font-medium">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-900 hover:bg-blue-950 text-white rounded text-sm font-bold shadow flex items-center gap-2">
                        <i class="fa-solid fa-user-check"></i> Save Credentials
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- EDIT MEMBER MODAL -->
    <div id="editModal" class="fixed inset-0 bg-black/60 hidden backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="bg-blue-950 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-user-pen text-sky-400"></i> Edit Member Profile</h3>
                <button onclick="closeEditModal()" class="text-slate-300 hover:text-white text-xl font-bold">&times;</button>
            </div>
            
            <form id="editForm" onsubmit="saveMemberChanges(event)" class="p-6 space-y-4">
                <input type="hidden" id="edit-doc-id">

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Member ID (Read Only)</label>
                    <input type="text" id="edit-member-id" disabled class="w-full p-2 bg-slate-100 border border-slate-300 rounded text-sm text-slate-500 font-mono">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Full Name</label>
                        <input type="text" id="edit-name" required class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Phone Number</label>
                        <input type="tel" id="edit-phone" required class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Designation</label>
                        <input type="text" id="edit-designation" required class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">District</label>
                        <select id="edit-district" onchange="onDistrictChange('edit-district', 'edit-block')" required class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Block Name</label>
                        <select id="edit-block" required class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">OAV School</label>
                        <input type="text" id="edit-oav" required class="w-full p-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-100">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-100 text-sm font-medium">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-900 hover:bg-blue-950 text-white rounded text-sm font-bold shadow flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentUserRole = sessionStorage.getItem("userRole") || "member";
        let currentUserDistrict = sessionStorage.getItem("userDistrict") || "";
        let allMembers = [];

            "Kalahandi": ["Bhawanipatna", "Dharamgarh", "Golamunda", "Jaipatna", "Junagarh", "Karlamunda", "Kesinga", "Lanjigarh", "M.Rampur", "Narla", "Thuamul Rampur", "Koksara"],
            "Kandhamal": ["Balliguda", "Chakapad", "Daringbadi", "G.Udayagiri", "K.Nuagaon", "Khajuripada", "Kotagarh", "Phiringia", "Phulbani", "Raikia", "Tikabali"],

            "Koraput": ["Bandhugaon", "Boipariguda", "Bori", "Dasmantpur", "Jeypore", "Koraput", "Kotpad", "Lamtaput", "Laxmipur", "Nandapur", "Narayapatna", "Pottangi", "Pujariput", "Similiguda"],
            "Malkangiri": ["Kalimela", "Khairaput", "Kudumulu Guma", "Malkangiri", "Mathili", "Podia", "Korkunda"],
            "Mayurbhanj": ["Badasahi", "Bahalda", "Bangriposi", "Baripada", "Betnoti", "Bijatala", "Bisoi", "Gopabandhunagar", "Jamda", "Jashipur", "Kaptipada", "Karanjia", "Khunta", "Kuliana", "Kusumi", "Morada", "Rairangpur", "Raruan", "Rasgovindpur", "Sarasdata", "Shamakhunta", "Suliapada", "Thakurmunda", "Tiring", "Udala"],

            "Nayagarh": ["Bhapur", "Daspalla", "Gania", "Khandapada", "Nayagarh", "Nuagaon", "Odagaon", "Ranpur"],
            "Nuapada": ["Boden", "Khariar", "Komna", "Nuapada", "Sinapali"],
            "Puri": ["Brahmagiri", "Delanga", "Gop", "Kanas", "Krushnaprasad", "Nimapapada", "Puri Sadar", "Pipili", "Satyabadi"],
            "Rayagada": ["Bissam Cuttack", "Chandrapur", "Gudari", "Gunupur", "Kalyansinghpur", "Kashipur", "Kolnara", "Muniguda", "Padmapur", "Ramanaguda", "Rayagada"],
            "Sambalpur": ["Bamra", "Batli", "Dhankauda", "Jamankira", "Jujomura", "Kuchainga", "Maneswar", "Naktideul", "Rairakhol", "Rengali"],
            "Subarnapur": ["Birmaharajpur", "Dunguripali", "Sonepur", "Tarbha", "Ullunda"],
            "Sundargarh": ["Bargaon", "Bisra", "Bonaigarh", "Gurundia", "Hemgir", "Kutra", "Koida", "Lahunipara", "Lathikata", "Lephripara", "Nabal", "Rajgangpur", "Subdega", "Sundargarh", "Tangarpali"]
        };

        window.onload = function() {
            populateInitialDropdowns();
            setupRolePermissions();
            fetchAuthorizedMembers();
        };

        function populateInitialDropdowns() {
            const filterDist = document.getElementById('district-filter');
            const editDist = document.getElementById('edit-district');
            const newDist = document.getElementById('new-user-district');

            Object.keys(odishaData).forEach(dist => {
                filterDist.innerHTML += `<option value="${dist}">${dist}</option>`;
                editDist.innerHTML += `<option value="${dist}">${dist}</option>`;
                newDist.innerHTML += `<option value="${dist}">${dist}</option>`;
            });
        }

        function onDistrictChange(districtElemId, blockElemId) {
            const distVal = document.getElementById(districtElemId).value;
            const blockSelect = document.getElementById(blockElemId);
            
            blockSelect.innerHTML = '<option value="">All Blocks</option>';

            if (distVal && odishaData[distVal]) {
                odishaData[distVal].forEach(b => {
                    blockSelect.innerHTML += `<option value="${b}">${b}</option>`;
                });
            }
        }

        function setupRolePermissions() {
            const badge = document.getElementById('role-badge');
            const distSelect = document.getElementById('district-filter');

            if (currentUserRole === 'state') {
                badge.textContent = "Role: State Super Admin (Full Access)";
                document.getElementById('state-user-btn').classList.remove('hidden');
            } else if (currentUserRole === 'district') {
                badge.textContent = `Role: District Admin (${currentUserDistrict})`;
                distSelect.value = currentUserDistrict;
                distSelect.disabled = true; // Restrict district admin to their district
                onDistrictChange('district-filter', 'block-filter');
            } else {
                badge.textContent = "Role: Member Access";
            }
        }

        // Fetch Data from Firestore based on credentials
        function fetchAuthorizedMembers() {
            let query = db.collection("members");

            if (currentUserRole === 'district') {
                query = query.where("district", "==", currentUserDistrict);
            }

            query.get().then((querySnapshot) => {
                allMembers = [];
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="8" class="p-6 text-center text-slate-400">No member records found.</td></tr>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    data.docId = doc.id;
                    allMembers.push(data);
                    renderRow(data);
                });
            });
        }

        function renderRow(data) {
            const tbody = document.getElementById('table-body');
            const row = document.createElement('tr');
            row.className = 'hover:bg-slate-50 transition border-b';

            const canEdit = currentUserRole === 'state' || (currentUserRole === 'district' && data.district === currentUserDistrict);

            row.innerHTML = `
                <td class="p-4 font-mono font-bold text-blue-600">${data.memberId || 'N/A'}</td>
                <td class="p-4 font-semibold">${data.fullName || 'N/A'}</td>
                <td class="p-4">${data.phone || 'N/A'}</td>
                <td class="p-4">${data.designation || 'N/A'}</td>
                <td class="p-4">${data.district || 'N/A'}</td>
                <td class="p-4">${data.blockName || 'N/A'}</td>
                <td class="p-4">${data.schoolOav || 'N/A'}</td>
                <td class="p-4 text-center">
                    ${canEdit ? `<button onclick='openEditModal(${JSON.stringify(data)})' class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded text-xs transition shadow-sm">Edit</button>` : `<span class="text-xs text-slate-400 font-semibold">Read Only</span>`}
                </td>
            `;
            tbody.appendChild(row);
        }

        // Search and Filter functionality
        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const selectedDistrict = document.getElementById('district-filter').value;
            const selectedBlock = document.getElementById('block-filter').value;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const filtered = allMembers.filter(member => {
                const matchesSearch = Object.values(member).some(val => 
                    String(val).toLowerCase().includes(query)
                );
                const matchesDistrict = !selectedDistrict || member.district === selectedDistrict;
                const matchesBlock = !selectedBlock || member.blockName === selectedBlock;
                return matchesSearch && matchesDistrict && matchesBlock;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="p-6 text-center text-slate-400">No matching records found.</td></tr>';
                return;
            }

            filtered.forEach(member => renderRow(member));
        }

        // STATE ADMIN: MANUALLY ASSIGN CREDENTIALS
        function openUserModal() { document.getElementById('userModal').classList.remove('hidden'); }
        function closeUserModal() { document.getElementById('userModal').classList.add('hidden'); }
        
        function toggleDistrictSelect() {
            const role = document.getElementById('new-user-role').value;
            document.getElementById('district-assign-box').style.display = role === 'state' ? 'none' : 'block';
        }

        async function handleCreateUser(e) {
            e.preventDefault();
            const role = document.getElementById('new-user-role').value;
            const district = role === 'district' ? document.getElementById('new-user-district').value : 'ALL';
            const manualId = document.getElementById('new-user-id').value;
            const password = document.getElementById('new-user-pass').value;

            try {
                // Save manually assigned credentials directly to Firestore
                await db.collection("users").doc(manualId).set({
                    username: manualId,
                    password: password,
                    role: role,
                    district: district,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert(`Account created successfully!\nID: ${manualId}\nRole: ${role}\nDistrict: ${district}`);
                closeUserModal();
            } catch (err) {
                alert("Error creating user: " + err.message);
            }
        }

        // Edit Modal Controls
        function openEditModal(member) {
            document.getElementById('edit-doc-id').value = member.docId;
            document.getElementById('edit-member-id').value = member.memberId;
            document.getElementById('edit-name').value = member.fullName || '';
            document.getElementById('edit-phone').value = member.phone || '';
            document.getElementById('edit-designation').value = member.designation || '';
            
            document.getElementById('edit-district').value = member.district || '';
            onDistrictChange('edit-district', 'edit-block');
            document.getElementById('edit-block').value = member.blockName || '';
            
            document.getElementById('edit-oav').value = member.schoolOav || '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        async function saveMemberChanges(e) {
            e.preventDefault();
            const docId = document.getElementById('edit-doc-id').value;

            const updatedData = {
                fullName: document.getElementById('edit-name').value,
                phone: document.getElementById('edit-phone').value,
                designation: document.getElementById('edit-designation').value,
                district: document.getElementById('edit-district').value,
                blockName: document.getElementById('edit-block').value,
                schoolOav: document.getElementById('edit-oav').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("members").doc(docId).update(updatedData);
                alert("Member record updated successfully!");
                closeEditModal();
                fetchAuthorizedMembers();
            } catch (error) {
                alert("Failed to update: " + error.message);
            }
        }

        function exportToExcel() {
            if (allMembers.length === 0) return alert("No member data available to export!");
            const exportData = allMembers.map(({ docId, ...rest }) => rest);
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "OAVTA Members");
            XLSX.writeFile(workbook, "OAVTA_Member_List.xlsx");
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
